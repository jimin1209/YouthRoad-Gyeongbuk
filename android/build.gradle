// 🔵 buildscript 블록 완전 제거 (AGP 8.x에서 필요 없음)

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            // 🔵 Kotlin 강제 버전 지정 제거 (pluginManagement에서 처리됨)

            // 🔵 annotation 최신 버전만 안전하게 고정
            force "androidx.annotation:annotation:1.8.0"
        }
    }
}

// 🔵 APK 강제 생성 패치 (Unity + Flutter 조합 필수)
subprojects { subproject ->
    if (subproject.name == "app") {
        subproject.afterEvaluate {
            if (subproject.hasProperty("android")) {
                subproject.android.applicationVariants.all { variant ->
                    variant.outputs.all { output ->
                        // AAB를 APK로 강제 변환
                        if (output.outputFile != null &&
                                output.outputFile.name?.endsWith(".aab")) {
                            def apkName = output.outputFile.name.replace(".aab", ".apk")
                            output.outputFileName = apkName
                        }
                    }
                }
            }
        }
    }

    // 🔵 flutter_unity_widget는 AGP 8.x 이상에서 namespace를 요구함
    if (subproject.name == "flutter_unity_widget") {
        subproject.plugins.withId("com.android.library") {
            def androidExt = subproject.extensions.findByName("android")
            if (androidExt?.hasProperty("namespace") && !androidExt.namespace) {
                androidExt.namespace = "com.xraph.plugin.flutter_unity_widget"
            }

            // Kotlin(기본 JDK 17)과 Java(기본 1.8) 타겟 미스매치 방지 → 둘 다 11로 맞춤
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }

        subproject.plugins.withId("org.jetbrains.kotlin.android") {
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                task.kotlinOptions.jvmTarget = "11"
            }
        }
    }
}
