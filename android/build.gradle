// android/build.gradle

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/* ──────────────────────────────
   🔵 APK 강제 복사 패치
   ────────────────────────────── */
subprojects { subproject ->
    if (subproject.name == "app") {
        subproject.afterEvaluate {

            subproject.tasks.matching { it.name == "packageDebug" }.configureEach { t ->
                t.doLast {
                    def fromApk = subproject.file(
                        "${subproject.projectDir}/build/outputs/apk/debug/app-debug.apk"
                    )

                    // 🔵 핵심: Flutter가 인식하는 위치 (프로젝트 루트/build)
                    def flutterDir = new File(
                        rootProject.projectDir,
                        "build/app/outputs/flutter-apk"
                    )

                    flutterDir.mkdirs()

                    if (fromApk.exists()) {
                        println("✔ Copying APK to Flutter directory: ${flutterDir}")
                        subproject.copy {
                            from fromApk
                            into flutterDir
                        }
                    } else {
                        println("✘ APK NOT FOUND at: ${fromApk}")
                    }
                }
            }
        }
    }
}