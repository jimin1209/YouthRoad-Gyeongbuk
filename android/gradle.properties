# 💙 Gradle JVM 메모리 안정화
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2G

# 💙 AndroidX / Jetifier 유지 (Unity + Flutter Plugin 호환 위해 필요)
android.useAndroidX=true
android.enableJetifier=true

# 💙 Kotlin Incremental Build 오류 방지
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx2G

# 💙 Worker API 스레드 최적화
org.gradle.workers.max=4

# 💙 Flutter + Unity + Kotlin 조합에서 필수 (Configuration Cache 충돌 방지)
org.gradle.configuration-cache=false
