plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.youthroad.app"
    compileSdk = 36

    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId = "com.youthroad.app"
        minSdk = 24
        targetSdk = 36

        versionCode = 1
        versionName = "1.0"

        multiDexEnabled = true
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
        doNotStrip "*/arm64-v8a/*.so"

        resources.pickFirsts += ['**/*.xml']
        resources.pickFirsts += ['**/*.properties']
        resources.pickFirsts += ['META-INF/*']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

/* ──────────────────────────────────────────────────────────────
   📌 Flutter 3.24에서 APK 경로 감지 버그 해결 (최종 공식 해결)
   ────────────────────────────────────────────────────────────── */
afterEvaluate {
    ["Debug", "Release"].each { variant ->
        tasks.matching { it.name == "package${variant}" }.configureEach { t ->
            t.doLast {
                def variantDir = variant.toLowerCase()
                def fromApk = file("$projectDir/build/outputs/apk/${variantDir}/app-${variantDir}.apk")

                def flutterDir = file("$rootDir/build/app/outputs/flutter-apk")
                def backupDir = file("$rootDir/build")

                println("FROM APK (${variant}): ${fromApk}")
                println("TO Flutter DIR: ${flutterDir}")
                println("TO Backup DIR : ${backupDir}")

                if (fromApk.exists()) {

                    // Flutter가 읽는 디렉토리로 복사
                    flutterDir.mkdirs()
                    copy {
                        from fromApk
                        into flutterDir
                    }

                    // 기존 백업 경로
                    backupDir.mkdirs()
                    copy {
                        from fromApk
                        into backupDir
                    }

                    println("✔ APK copied successfully to both directories (package${variant}).")
                } else {
                    println("✘ APK NOT FOUND at: ${fromApk}")
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation project(":unityLibrary")
}

configurations.all {
    exclude group: "com.unity3d.player"
    exclude module: "unity-classes"
}

repositories {
    flatDir {
        dirs "${project(':unityLibrary').projectDir}/libs"
    }
}
