plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.youth_road_app"
    compileSdk = 34
    buildToolsVersion = "34.0.0"

    def unityAbis = (rootProject.findProperty("unity.abis") ?: "arm64-v8a")
            .toString()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (unityAbis.isEmpty()) {
        unityAbis = ["arm64-v8a"]
    }

    defaultConfig {
        applicationId = "com.example.youth_road_app"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        multiDexEnabled true

        ndk {
            abiFilters unityAbis
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        unityAbis.each { abi ->
            doNotStrip "*/${abi}/*.so"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"

    // Unity 라이브러리 연결
    implementation project(":unityLibrary")
}

repositories {
    flatDir {
        dirs "${project(':unityLibrary').projectDir}/libs"
    }
}
