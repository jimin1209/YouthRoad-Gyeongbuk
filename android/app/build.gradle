plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.youthroad.app"
    compileSdk = 36

    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId = "com.youthroad.app"
        minSdk = 24
        targetSdk = 36

        versionCode = 1
        versionName = "1.0"

        multiDexEnabled = true
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
        doNotStrip "*/arm64-v8a/*.so"

        resources.pickFirsts += ['**/*.xml']
        resources.pickFirsts += ['**/*.properties']
        resources.pickFirsts += ['META-INF/*']
    }

    // 🔵 Java/Kotlin 1.8로 명확히 고정 (Unity + 플러그인 호환)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation project(":unityLibrary")
}

configurations.all {
    exclude group: "com.unity3d.player"
    exclude module: "unity-classes"
}

repositories {
    flatDir {
        dirs "${project(':unityLibrary').projectDir}/libs"
    }
}
