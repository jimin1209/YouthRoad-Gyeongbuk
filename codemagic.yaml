workflows:
  ios_unsigned_ipa:
    name: Build iOS IPA (Unsigned) + Upload to GitHub Release
    max_build_duration: 60
    environment:
      vars:
        GITHUB_REPO: "jimin1209/YouthRoad-Gyeongbuk"
      flutter: stable
      xcode: latest

    scripts:
      # 1) Flutter clean
      - name: Clean Flutter
        script: flutter clean

      # 2) Install dependencies
      - name: Install dependencies
        script: flutter pub get

      # 3) iOS build (unsigned IPA)
      - name: Build iOS (Unsigned IPA)
        script: flutter build ipa --no-codesign

      # 4) Create GitHub Release
      - name: Create GitHub Release
        script: |
          TAG="ios-build-$(date +'%Y-%m-%d_%H-%M-%S')"
          RELEASE_NAME="iOS Build $TAG"
          IPA_PATH="build/ios/ipa/Runner-unsigned.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ IPA not found: $IPA_PATH"
            exit 1
          fi

          echo "📤 Creating GitHub Release for $TAG"

          RELEASE_RESPONSE=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\", \"name\":\"$RELEASE_NAME\", \"body\":\"Auto-generated unsigned IPA release.\"}" \
            "https://api.github.com/repos/$GITHUB_REPO/releases")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")

          echo "✔ Release created with ID: $RELEASE_ID"

          # 5) Upload IPA asset
          UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPO/releases/$RELEASE_ID/assets?name=Runner-unsigned-$TAG.ipa"

          echo "📦 Uploading IPA to GitHub Release..."

          curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$IPA_PATH" \
            "$UPLOAD_URL"

          echo "🎉 IPA Upload Complete!"

    artifacts:
      - build/ios/ipa/Runner-unsigned.ipa

