workflows:
  youthroad_ios:
    name: YouthRoad iOS Build (Unsigned for AltStore)
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
      vars:
        YOUTH_API_KEY: $YOUTH_API_KEY
        KAKAO_MAP_API_KEY: $KAKAO_MAP_API_KEY
        CHAT_ENDPOINT: $CHAT_ENDPOINT

    scripts:
      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned IPA (no code signing)
        script: |
          flutter build ipa \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --dart-define=YOUTH_API_KEY=$YOUTH_API_KEY \
            --dart-define=KAKAO_MAP_API_KEY=$KAKAO_MAP_API_KEY \
            --dart-define=CHAT_ENDPOINT=$CHAT_ENDPOINT

    artifacts:
      - build/ios/ipa/*.ipa

  youthroad_android:
    name: YouthRoad Android Build (Release)
    max_build_duration: 45
    environment:
      flutter: 3.24.5
    scripts:
      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --dart-define=YOUTH_API_KEY=$YOUTH_API_KEY \
            --dart-define=KAKAO_MAP_API_KEY=$KAKAO_MAP_API_KEY \
            --dart-define=CHAT_ENDPOINT=$CHAT_ENDPOINT

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
