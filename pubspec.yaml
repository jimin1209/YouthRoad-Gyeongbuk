name: youth_road_app
description: YouthRoad Flutter + No Unity project

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  http: ^1.1.0
  cupertino_icons: ^1.0.8

  # State management / routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  retrofit: ^4.5.0
  dio: ^5.7.0

  # Local persistence
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # UI / WebView / Launcher
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  intl: ^0.19.0

  # Location
  geolocator: 9.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.10
  retrofit_generator: ^7.0.0
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1
  freezed: ^2.4.7
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

# 🔥 매우 중요: 로컬 geolocator_android 플러그인 override
dependency_overrides:
  geolocator_android:
    path: android/plugins/geolocator_android
  isar_flutter_libs:
    path: android/plugins/isar_flutter_libs