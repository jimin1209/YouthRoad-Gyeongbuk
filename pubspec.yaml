name: youth_road_app
description: YouthRoad Flutter + Unity integrated project

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  retrofit: ^4.5.0
  dio: ^5.7.0
  shared_preferences: ^2.1.1

  # Local persistence
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  flutter_unity_widget: ^2022.1.1+5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  freezed: ^2.5.7
  retrofit_generator: ^8.2.1
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
